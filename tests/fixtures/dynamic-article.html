<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamic article fixture</title>
    <style>
      :root { font: 18px/1.65 system-ui, sans-serif; color: #24322d; background: #f6f8f6; }
      body { margin: 0; }
      nav { padding: 12px 24px; background: #e3ebe5; border-bottom: 1px solid #bbcbbf; }
      nav button { margin: 3px; padding: 6px 10px; }
      nav output { display: block; font: 13px/1.5 monospace; }
      main { max-width: 720px; margin: 24px auto; padding: 0 24px 80px; }
      h1 { font-size: 1.7rem; }
      p { margin-block: 1em; }
      a { color: #246b4b; }
      #coverage { border-top: 1px solid #c5d0c7; margin-top: 32px; padding-top: 16px; }
      #div-only-copy { margin-block: 16px; }
      #long-content p { min-height: 180px; padding-block: 12px; border-top: 1px solid #dce3dd; }
      #long-chunk { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <!--
      Offline fixture: no external resources, fetch, extension calls, or model calls.
      Serve this file on any HTTP path, including requests with ?fixtureRoute=beta.
      window.dynamicArticle exposes deterministic browser-test controls:
        navigate("alpha" | "beta", "push" | "replace") -> snapshot
        back() / forward() -> Promise<snapshot> (resolved by this fixture's popstate)
        appendParagraph(text?, id?) -> paragraph ID
        editSource(text) -> source text
        editSequence(texts, intervalMs = 15) -> Promise<snapshot>
        replaceBody(route?) -> snapshot; keeps the global API and popstate listener
        setLongParagraphs(count = 24) -> paragraph IDs
        addLongChunk(repetitions = 80) -> ID of a source longer than one 1,500-char chunk
        snapshot() -> counters, source, appended IDs, connection/route state
        events() -> copy of ordered fixture events; clearEvents() empties that log
      Stable source IDs: article-title, linked-paragraph, source-link,
      mutable-paragraph, appended-content, nested-parent, nested-child,
      div-only-copy, div-inline-copy, long-content, long-paragraph-1..N, long-chunk.
      Only controls live under nav. They are deliberately ordinary page DOM.
    -->
    <script>
      (() => {
        "use strict";
        const routes = new Set(["alpha", "beta"]);
        const eventLog = [];
        let eventSequence = 0;
        let appendSequence = 0;
        let routeRevision = 0;
        let bodyRevision = 0;
        let editGeneration = 0;
        let linkClicks = 0;
        let route = routeFromUrl();

        function routeFromUrl() {
          const requested = new URL(location.href).searchParams.get("fixtureRoute");
          return routes.has(requested) ? requested : "alpha";
        }

        function requireRoute(value) {
          if (!routes.has(value)) throw new Error(`Unknown fixture route: ${value}`);
          return value;
        }

        function record(type, detail = {}) {
          const event = { sequence: ++eventSequence, type, route, routeRevision, bodyRevision, ...detail };
          eventLog.push(event);
          window.dispatchEvent(new CustomEvent("dynamic-article:event", { detail: { ...event } }));
          return event;
        }

        function snapshot() {
          return {
            route, routeRevision, bodyRevision, linkClicks, url: location.href,
            source: document.getElementById("mutable-paragraph")?.textContent ?? null,
            appendedIds: Array.from(document.querySelectorAll("#appended-content > p"), (node) => node.id),
            longParagraphCount: document.querySelectorAll("#long-content > p").length,
            linkConnected: Boolean(document.getElementById("source-link")?.isConnected),
            eventSequence,
          };
        }

        function updateStatus() {
          const status = document.getElementById("fixture-status");
          if (status) status.textContent = `route=${route}; revision=${routeRevision}; body=${bodyRevision}; clicks=${linkClicks}`;
        }

        function setLongParagraphs(count = 24) {
          if (!Number.isInteger(count) || count < 0 || count > 120) throw new Error("Paragraph count must be an integer from 0 to 120.");
          const container = document.getElementById("long-content");
          if (!container) throw new Error("Long-content root is missing.");
          const paragraphs = Array.from({ length: count }, (_, index) => {
            const paragraph = document.createElement("p");
            paragraph.id = `long-paragraph-${index + 1}`;
            paragraph.textContent = `Route ${route} viewport paragraph ${index + 1}. This paragraph is deliberately separated from the next one for scroll scheduling tests.`;
            return paragraph;
          });
          container.replaceChildren(...paragraphs);
          record("long-content", { count });
          return paragraphs.map((paragraph) => paragraph.id);
        }

        function renderArticle(nextRoute) {
          route = requireRoute(nextRoute);
          routeRevision += 1;
          editGeneration += 1;
          const article = document.getElementById("fixture-article");
          if (!article) throw new Error("Article root is missing.");
          article.innerHTML = `
            <h1 id="article-title">Route ${route} article title</h1>
            <p id="linked-paragraph">Read the <a id="source-link" href="#source-reference">original source link</a> before changing this page.</p>
            <p id="mutable-paragraph">Route ${route} original mutable paragraph.</p>
            <section id="appended-content" aria-label="New article paragraphs"></section>
            <section id="coverage" aria-label="Extraction coverage cases">
              <ul><li id="nested-parent">Parent list introduction.
                <ul><li id="nested-child">Nested child list body.</li></ul>
                Parent list conclusion.
              </li></ul>
              <div id="div-only-copy">Plain div article body without a paragraph element.</div>
              <div id="div-inline-copy">Plain div with <span>inline span text</span> and <code>preserve_this()</code>.</div>
            </section>
            <section id="long-content" aria-label="Long article"></section>`;
          document.getElementById("source-link").addEventListener("click", (event) => {
            // Observe the real element listener without introducing hash navigation.
            event.preventDefault();
            linkClicks += 1;
            updateStatus();
            record("source-link-click", { linkClicks });
          });
          setLongParagraphs(24);
          updateStatus();
          record("article-rendered");
        }

        function navigate(nextRoute, mode = "push") {
          requireRoute(nextRoute);
          if (mode !== "push" && mode !== "replace") throw new Error("Navigation mode must be push or replace.");
          const nextUrl = new URL(location.href);
          nextUrl.searchParams.set("fixtureRoute", nextRoute);
          history[mode === "push" ? "pushState" : "replaceState"]({ fixtureRoute: nextRoute }, "", nextUrl);
          record("history-change", { nextRoute, mode });
          renderArticle(nextRoute);
          record("navigation-complete", { mode });
          return snapshot();
        }

        function traverseHistory(direction) {
          return new Promise((resolve, reject) => {
            const onNavigation = (event) => {
              if (event.detail.type !== "navigation-complete" || event.detail.mode !== "pop") return;
              clearTimeout(timeout);
              window.removeEventListener("dynamic-article:event", onNavigation);
              resolve(snapshot());
            };
            const timeout = setTimeout(() => {
              window.removeEventListener("dynamic-article:event", onNavigation);
              reject(new Error("History traversal produced no popstate; navigate with push before traversing."));
            }, 2_000);
            window.addEventListener("dynamic-article:event", onNavigation);
            history[direction]();
          });
        }

        function appendParagraph(text, id) {
          const paragraph = document.createElement("p");
          paragraph.id = id ?? `appended-paragraph-${++appendSequence}`;
          if (document.getElementById(paragraph.id)) throw new Error(`Duplicate fixture ID: ${paragraph.id}`);
          paragraph.textContent = text ?? `Route ${route} newly appended paragraph ${appendSequence}.`;
          document.getElementById("appended-content").append(paragraph);
          record("paragraph-appended", { id: paragraph.id, source: paragraph.textContent });
          return paragraph.id;
        }

        function writeSource(text) {
          if (typeof text !== "string") throw new Error("Source text must be a string.");
          const paragraph = document.getElementById("mutable-paragraph");
          if (!paragraph) throw new Error("Mutable paragraph is missing.");
          paragraph.textContent = text;
          record("source-edited", { source: text });
          return text;
        }

        function editSource(text) {
          editGeneration += 1;
          return writeSource(text);
        }

        async function editSequence(texts, intervalMs = 15) {
          if (!Array.isArray(texts) || texts.some((text) => typeof text !== "string")) throw new Error("Edits must be strings.");
          if (!Number.isFinite(intervalMs) || intervalMs < 0 || intervalMs > 1_000) throw new Error("Edit interval must be between 0 and 1,000 ms.");
          const generation = ++editGeneration;
          for (let index = 0; index < texts.length; index += 1) {
            if (generation !== editGeneration) break;
            writeSource(texts[index]);
            if (index < texts.length - 1) await new Promise((resolve) => setTimeout(resolve, intervalMs));
          }
          return snapshot();
        }

        function addLongChunk(repetitions = 80) {
          if (!Number.isInteger(repetitions) || repetitions < 1 || repetitions > 500) throw new Error("Invalid repetition count.");
          document.getElementById("long-chunk")?.remove();
          const paragraph = document.createElement("p");
          paragraph.id = "long-chunk";
          paragraph.textContent = `Route ${route} multi-chunk source. ` + "The same long paragraph must not monopolize every visible translation slot. ".repeat(repetitions);
          document.getElementById("mutable-paragraph").insertAdjacentElement("afterend", paragraph);
          record("long-chunk-added", { sourceLength: paragraph.textContent.length });
          return paragraph.id;
        }

        function mountBody(nextRoute) {
          bodyRevision += 1;
          const body = document.createElement("body");
          body.innerHTML = `<nav aria-label="Fixture controls">
            <button id="navigate-alpha" type="button">Route alpha</button>
            <button id="navigate-beta" type="button">Route beta</button>
            <button id="append-paragraph" type="button">Append paragraph</button>
            <button id="rapid-edit" type="button">Edit A → B → C</button>
            <button id="replace-body" type="button">Replace body</button>
            <output id="fixture-status"></output>
          </nav><main><article id="fixture-article"></article></main>`;
          document.body.replaceWith(body);
          document.getElementById("navigate-alpha").addEventListener("click", () => navigate("alpha"));
          document.getElementById("navigate-beta").addEventListener("click", () => navigate("beta"));
          document.getElementById("append-paragraph").addEventListener("click", () => appendParagraph());
          document.getElementById("rapid-edit").addEventListener("click", () => {
            void editSequence(["Rapid source version A.", "Rapid source version B.", "Rapid source version C."]);
          });
          document.getElementById("replace-body").addEventListener("click", () => replaceBody());
          renderArticle(nextRoute);
          document.body.dataset.fixtureReady = "true";
        }

        function replaceBody(nextRoute = route) {
          requireRoute(nextRoute);
          if (nextRoute !== route) navigate(nextRoute, "replace");
          mountBody(nextRoute);
          record("body-replaced");
          return snapshot();
        }

        window.addEventListener("popstate", () => {
          renderArticle(routeFromUrl());
          record("navigation-complete", { mode: "pop" });
        });

        window.dynamicArticle = Object.freeze({
          navigate,
          back: () => traverseHistory("back"),
          forward: () => traverseHistory("forward"),
          appendParagraph, editSource, editSequence, replaceBody, setLongParagraphs, addLongChunk,
          snapshot,
          events: () => eventLog.map((event) => ({ ...event })),
          clearEvents: () => { eventLog.length = 0; },
        });
        mountBody(route);
        record("ready");
      })();
    </script>
  </body>
</html>
